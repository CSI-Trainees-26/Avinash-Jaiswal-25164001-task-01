<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusFind</title>
    <link rel="stylesheet" href="stylelogin.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-brand">

        <div class="logo">
            🎓 CampusFind
        </div>

        <div class="auth-illustration">
            🎓
        </div>

        <h1>Start your college journey.</h1>

        <p>
            Discover colleges, explore courses and
            keep your applications organized.
        </p>

    </div>


    <div class="auth-form">

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

        <div class="form-heading">

            <span class="section-label">WELCOME BACK</span>

            <h2>Sign in to CampusFind</h2>

            <p>
                Enter your details to access your dashboard.
            </p>

        </div>


        <form>

            <label>Email Address</label>

            <input
                type="email"
                placeholder="you@example.com"
            >


            <label>Password</label>

            <input
                type="password"
                placeholder="Enter your password"
            >


            <div class="remember">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot password?</a>

            </div>


            <button type="submit" class="primary-btn full">
                Sign In
            </button>

        </form>


        <div class="divider">
            <span>OR</span>
        </div>


        <button class="social-btn">
            🌐 Continue with Google
        </button>


        <p class="register-text">
            Don't have an account?
            <a href="#">Create one</a>
        </p>

    </div>

</div>

</body>
</html>
