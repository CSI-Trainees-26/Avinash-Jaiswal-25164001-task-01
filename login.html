<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Login - CampusFind</title>
    <link rel="stylesheet" href="stylelogin.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-brand">

        <div class="logo">
            &#127891; CampusFind
        </div>

        <div class="auth-illustration">
            &#127891;
        </div>

        <h1>Start your college journey.</h1>

        <p>
            Discover colleges, explore courses and
            keep your applications organized.
        </p>
        <img class="college-image" src="https://img.magnific.com/premium-vector/college-search-tools-online-isolated-cartoon-vector-illustrations_107173-21726.jpg?semt=ais_hybrid&w=740&q=80" width="100%">

    </div>


    <div class="auth-form">

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

        <div class="form-heading">

            <span class="section-label">WELCOME BACK</span>

            <h2>Sign in to CampusFind</h2>

            <p>
                Enter your details to access your dashboard.
            </p>

        </div>


        <form>

            <label>Email Address</label>

            <input
                type="email"
                placeholder="you@example.com"
            >


            <label>Password</label>

            <input
                type="password"
                placeholder="Enter your password"
            >


            <div class="remember">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot password?</a>

            </div>


            <button type="submit" class="primary-btn full">
                Sign In
            </button>

        </form>


        <div class="divider">
            <span>OR</span>
        </div>


        <button class="social-btn">
            &#127760; Continue with Google
        </button>


        <p class="register-text">
            Don't have an account?
            <a href="#">Create one</a>
        </p>

    </div>

</div>

</body>
</html>
